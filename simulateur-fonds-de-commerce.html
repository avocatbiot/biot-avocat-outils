<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulateur droits d'enregistrement — Cession de fonds de commerce | Me Benoît BIOT</title>
<meta name="description" content="Calculez les droits d'enregistrement dus lors d'une cession de fonds de commerce. Simulateur gratuit par Me Benoît BIOT, avocat au Barreau de Montpellier." />
<meta name="author" content="Me Benoît BIOT" />
<link rel="canonical" href="https://biot-avocat-outils.vercel.app/simulateur-fonds-de-commerce.html" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Georgia', 'Times New Roman', serif; background: #FAFAF8; color: #1A1A2E; }
  input:focus { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  bg: "#FAFAF8", card: "#FFFFFF", navy: "#1B2A4A", navyLight: "#2D4A6F",
  gold: "#C8963E", goldLight: "#F5EDE0", goldDark: "#A67A2E",
  text: "#1A1A2E", muted: "#5A6577", border: "#E2E5EA",
  success: "#2D7D46", infoBg: "#EEF3F9", warnBg: "#FFF8ED", warnBorder: "#F0D88A",
};

const fmt = (n) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2 }).format(n);
const pct = (n) => n.toFixed(2).replace(".", ",") + " %";

function calc({ prix, marchandises, zfu, abat }) {
  const base = Math.max(0, prix - marchandises);
  let ab = 0, ba = base;
  if (abat) { ab = Math.min(500000, base); ba = Math.max(0, base - ab); }
  const t2 = zfu ? 0.01 : 0.03;
  const tranches = [];
  let total = 0;
  const t1v = Math.min(ba, 23000);
  tranches.push({ label: "0 € à 23 000 €", base: t1v, taux: 0, droits: 0 });
  if (ba > 23000) { const v = Math.min(ba, 107000) - 23000; const d = v * t2; total += d; tranches.push({ label: "23 001 € à 107 000 €", base: v, taux: t2, droits: d, zfu }); }
  if (ba > 107000) { const v = Math.min(ba, 200000) - 107000; const d = v * 0.03; total += d; tranches.push({ label: "107 001 € à 200 000 €", base: v, taux: 0.03, droits: d }); }
  if (ba > 200000) { const v = ba - 200000; const d = v * 0.05; total += d; tranches.push({ label: "Au-delà de 200 000 €", base: v, taux: 0.05, droits: d }); }
  // Minimum de perception 25€ dès qu'il y a une cession (art. 674 CGI)
  const minApplied = prix > 0 && total < 25;
  if (prix > 0 && total < 25) total = 25;
  return { base, ab, ba, tranches, total, minApplied };
}

function NumInput({ label, value, onChange, hint }) {
  const [focused, setFocused] = useState(false);
  return (
    <div style={{ marginBottom: 20 }}>
      <label style={{ display: "block", fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 6 }}>{label}</label>
      <input type="text" inputMode="numeric"
        value={value === 0 ? "" : value.toLocaleString("fr-FR")}
        onChange={(e) => { const r = e.target.value.replace(/[^0-9]/g, ""); onChange(r === "" ? 0 : parseInt(r, 10)); }}
        placeholder="0"
        onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
        style={{ width: "100%", padding: "12px 16px", fontSize: 17, fontWeight: 500, border: `1.5px solid ${focused ? C.gold : C.border}`, borderRadius: 10, background: C.card, color: C.text, fontFamily: "'Georgia', serif", transition: "border-color 0.2s" }}
      />
      {hint && <p style={{ margin: "4px 0 0", fontSize: 12, color: C.muted }}>{hint}</p>}
    </div>
  );
}

function Toggle({ label, checked, onChange, desc }) {
  return (
    <div onClick={onChange} style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "12px 16px", borderRadius: 10, background: checked ? C.goldLight : C.bg, border: `1px solid ${checked ? C.gold : C.border}`, marginBottom: 12, cursor: "pointer", transition: "all 0.2s" }}>
      <div style={{ width: 44, minWidth: 44, height: 24, borderRadius: 12, background: checked ? C.gold : "#CBD2DC", position: "relative", transition: "background 0.2s", marginTop: 2 }}>
        <div style={{ width: 20, height: 20, borderRadius: "50%", background: "#fff", position: "absolute", top: 2, left: checked ? 22 : 2, transition: "left 0.2s", boxShadow: "0 1px 3px rgba(0,0,0,0.15)" }} />
      </div>
      <div>
        <div style={{ fontSize: 14, fontWeight: 600, color: C.navy }}>{label}</div>
        {desc && <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{desc}</div>}
      </div>
    </div>
  );
}

function App() {
  const [prix, setPrix] = useState(0);
  const [march, setMarch] = useState(0);
  const [zfu, setZfu] = useState(false);
  const [abat, setAbat] = useState(false);
  const r = prix > 0 ? calc({ prix, marchandises: march, zfu, abat }) : null;

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'Georgia', 'Times New Roman', serif" }}>
      {/* Header */}
      <div style={{ background: C.navy, padding: "28px 20px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.15em", textTransform: "uppercase", color: C.gold, marginBottom: 8 }}>Simulateur — biot-avocat.com</div>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700, color: "#fff", lineHeight: 1.3 }}>Droits d'enregistrement</h1>
        <h2 style={{ margin: "4px 0 0", fontSize: 16, fontWeight: 400, color: "rgba(255,255,255,0.7)" }}>Cession de fonds de commerce</h2>
      </div>

      <div style={{ padding: "12px 20px", background: C.infoBg, borderBottom: `1px solid ${C.border}` }}>
        <p style={{ fontSize: 12, color: C.navyLight, lineHeight: 1.5 }}>Base légale : art. 719 à 723 CGI — Barème incluant droit budgétaire, taxe départementale et taxe communale.</p>
      </div>

      {/* Form */}
      <div style={{ padding: "24px 20px" }}>
        <NumInput label="Prix de cession du fonds" value={prix} onChange={setPrix} hint="Hors marchandises neuves. Inclut clientèle, droit au bail, matériel." />
        <NumInput label="Dont marchandises neuves" value={march} onChange={setMarch} hint="Exonérées de droits d'enregistrement (art. 723 CGI)." />
        <div style={{ marginTop: 8, marginBottom: 8 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: C.navy, marginBottom: 10 }}>Options & exonérations</div>
          <Toggle label="Zone ZFU-TE ou ZFRR" checked={zfu} onChange={() => setZfu(!zfu)} desc="Taux réduit de 3 % à 1 % sur la tranche 23 001 – 107 000 € (engagement 5 ans)." />
          <Toggle label="Cession à un salarié CDI (2 ans) ou famille" checked={abat} onChange={() => setAbat(!abat)} desc="Abattement de 500 000 € sur la valeur du fonds (art. 732 ter CGI)." />
        </div>
      </div>

      {/* Results */}
      {r && (
        <div style={{ padding: "0 20px 32px" }}>
          <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.border}`, overflow: "hidden", boxShadow: "0 2px 12px rgba(27,42,74,0.06)" }}>
            <div style={{ padding: "20px 20px 16px", borderBottom: `1px solid ${C.border}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Droits d'enregistrement estimés</div>
              <div style={{ fontSize: 34, fontWeight: 700, color: C.navy }}>{fmt(r.total)}</div>
              {r.total > 0 && <div style={{ fontSize: 13, color: C.muted, marginTop: 6 }}>soit {pct(r.total / prix * 100)} du prix de cession</div>}
            </div>

            {(march > 0 || abat) && (
              <div style={{ padding: "16px 20px", borderBottom: `1px solid ${C.border}`, background: C.bg }}>
                <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.08em" }}>Calcul de la base taxable</div>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 4 }}>
                  <span style={{ color: C.muted }}>Prix de cession</span>
                  <span style={{ fontWeight: 600 }}>{fmt(prix)}</span>
                </div>
                {march > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 4 }}>
                  <span style={{ color: C.muted }}>– Marchandises neuves</span>
                  <span style={{ fontWeight: 600, color: C.success }}>– {fmt(march)}</span>
                </div>}
                {abat && r.ab > 0 && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 4 }}>
                  <span style={{ color: C.muted }}>– Abattement salarié/famille</span>
                  <span style={{ fontWeight: 600, color: C.success }}>– {fmt(r.ab)}</span>
                </div>}
                <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 8, paddingTop: 8, display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                  <span style={{ fontWeight: 700, color: C.navy }}>Base taxable</span>
                  <span style={{ fontWeight: 700, color: C.navy }}>{fmt(r.ba)}</span>
                </div>
              </div>
            )}

            <div style={{ padding: "16px 20px" }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 12, textTransform: "uppercase", letterSpacing: "0.08em" }}>Détail par tranche</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: "8px 16px", fontSize: 13, alignItems: "center" }}>
                <div style={{ fontWeight: 700, color: C.navy, fontSize: 11, textTransform: "uppercase" }}>Tranche</div>
                <div style={{ fontWeight: 700, color: C.navy, fontSize: 11, textTransform: "uppercase", textAlign: "right" }}>Taux</div>
                <div style={{ fontWeight: 700, color: C.navy, fontSize: 11, textTransform: "uppercase", textAlign: "right" }}>Droits</div>
                {r.tranches.map((t, i) => (
                  <React.Fragment key={i}>
                    <div style={{ color: C.text }}>{t.label}{t.zfu && <span style={{ fontSize: 10, color: C.success, fontWeight: 600, marginLeft: 4 }}>ZFU</span>}</div>
                    <div style={{ textAlign: "right", color: C.muted, fontWeight: 500 }}>{pct(t.taux * 100)}</div>
                    <div style={{ textAlign: "right", fontWeight: 600, color: t.droits > 0 ? C.navy : C.muted }}>{fmt(t.droits)}</div>
                  </React.Fragment>
                ))}
              </div>
            </div>

            {r.minApplied && (
              <div style={{ padding: "12px 20px", background: C.warnBg, borderTop: `1px solid ${C.warnBorder}` }}>
                <p style={{ fontSize: 12, color: C.goldDark }}>⚠️ Minimum de perception de 25 € appliqué (art. 674 CGI).</p>
              </div>
            )}
          </div>

          <div style={{ marginTop: 20, padding: 16, borderRadius: 10, background: C.warnBg, border: `1px solid ${C.warnBorder}` }}>
            <p style={{ fontSize: 12, color: C.goldDark, lineHeight: 1.6 }}>
              <strong>Avertissement :</strong> Cette simulation est fournie à titre indicatif et ne constitue pas un conseil juridique ou fiscal personnalisé. Les résultats ne prennent pas en compte les honoraires d'avocat, les frais de greffe et les frais de publicité légale notamment.
              <br /><br /><strong>Me Benoît BIOT</strong> — Avocat au Barreau de Montpellier
            </p>
          </div>

          <a href="https://cal.com/maitre-benoit-biot/appel-decouverte" target="_blank" rel="noopener noreferrer"
            style={{ display: "block", marginTop: 16, padding: 16, background: C.gold, color: "#fff", textAlign: "center", borderRadius: 12, fontSize: 15, fontWeight: 700, textDecoration: "none", letterSpacing: "0.02em", boxShadow: `0 4px 14px ${C.gold}44` }}>
            Prendre rendez-vous — Appel découverte gratuit
          </a>
        </div>
      )}

      {!r && (
        <div style={{ padding: "40px 20px", textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>⬆️</div>
          <p style={{ color: C.muted, fontSize: 14 }}>Saisissez le prix de cession pour obtenir une estimation.</p>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
