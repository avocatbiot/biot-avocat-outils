<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulateur droits d'enregistrement — Cession de droits sociaux | Me Benoît BIOT</title>
<meta name="description" content="Calculez les droits d'enregistrement dus lors d'une cession d'actions (SAS, SA) ou de parts sociales (SARL, SNC). Simulateur gratuit par Me Benoît BIOT, avocat au Barreau de Montpellier." />
<meta name="author" content="Me Benoît BIOT" />
<link rel="canonical" href="https://biot-avocat-outils.vercel.app/simulateur-droits-sociaux.html" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Georgia', 'Times New Roman', serif; background: #FAFAF8; color: #1A1A2E; }
  input:focus { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const C = {
  bg: "#FAFAF8", card: "#FFFFFF", navy: "#1B2A4A", navyLight: "#2D4A6F",
  gold: "#C8963E", goldLight: "#F5EDE0", goldDark: "#A67A2E",
  text: "#1A1A2E", muted: "#5A6577", border: "#E2E5EA",
  success: "#2D7D46", infoBg: "#EEF3F9", warnBg: "#FFF8ED", warnBorder: "#F0D88A",
};

const fmt = (n) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2 }).format(n);

const TYPES = [
  { id: "actions", label: "Actions", sub: "SAS · SA · Sociétés par actions", taux: 0.001, tauxLabel: "0,10 %", article: "Art. 726 I-1° CGI", parts: false, color: "#3B6FA0" },
  { id: "parts", label: "Parts sociales", sub: "SARL · SNC · Sociétés civiles", taux: 0.03, tauxLabel: "3 %", article: "Art. 726 I-1° bis CGI", parts: true, color: "#C8963E" },
  { id: "immo", label: "Prépondérance immobilière", sub: "SCI · Sociétés à prépondérance immo.", taux: 0.05, tauxLabel: "5 %", article: "Art. 726 I-2° CGI", parts: false, color: "#7B5EA7" },
];

function compute({ type, prix, nbCed, nbTot }) {
  const cfg = TYPES.find(t => t.id === type);
  if (!cfg || prix <= 0) return null;
  let ab = 0, base = prix;
  if (type === "parts" && nbCed > 0 && nbTot > 0) {
    ab = Math.round((23000 * nbCed) / nbTot);
    ab = Math.min(ab, prix);
    base = Math.max(0, prix - ab);
  }
  let droits = base * cfg.taux;
  const minApplied = prix > 0 && droits < 25;
  if (prix > 0 && droits < 25) droits = 25;
  return { cfg, prix, ab, base, droits, eff: prix > 0 ? droits / prix : 0, hasAb: type === "parts" && ab > 0, minApplied };
}

function NumInput({ label, value, onChange, hint }) {
  const [f, setF] = useState(false);
  return (
    <div style={{ marginBottom: 20 }}>
      <label style={{ display: "block", fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 6 }}>{label}</label>
      <input type="text" inputMode="numeric"
        value={value === 0 ? "" : value.toLocaleString("fr-FR")}
        onChange={(e) => { const r = e.target.value.replace(/[^0-9]/g, ""); onChange(r === "" ? 0 : parseInt(r, 10)); }}
        placeholder="0" onFocus={() => setF(true)} onBlur={() => setF(false)}
        style={{ width: "100%", padding: "12px 16px", fontSize: 17, fontWeight: 500, border: `1.5px solid ${f ? C.gold : C.border}`, borderRadius: 10, background: C.card, color: C.text, fontFamily: "'Georgia', serif", transition: "border-color 0.2s" }}
      />
      {hint && <p style={{ margin: "4px 0 0", fontSize: 12, color: C.muted }}>{hint}</p>}
    </div>
  );
}

function TypeSel({ selected, onSelect }) {
  return (
    <div style={{ marginBottom: 24 }}>
      <label style={{ display: "block", fontSize: 14, fontWeight: 600, color: C.navy, marginBottom: 10 }}>Type de cession</label>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {TYPES.map(t => {
          const a = selected === t.id;
          return (
            <div key={t.id} onClick={() => onSelect(t.id)}
              style={{ padding: "14px 16px", borderRadius: 12, border: `2px solid ${a ? t.color : C.border}`, background: a ? `${t.color}08` : C.card, cursor: "pointer", transition: "all 0.2s", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style={{ fontSize: 15, fontWeight: 700, color: a ? t.color : C.text }}>{t.label}</div>
                <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>{t.sub}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 18, fontWeight: 700, color: a ? t.color : C.muted }}>{t.tauxLabel}</div>
                <div style={{ fontSize: 10, color: C.muted }}>{t.article}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [type, setType] = useState("actions");
  const [prix, setPrix] = useState(0);
  const [nbCed, setNbCed] = useState(0);
  const [nbTot, setNbTot] = useState(0);
  const sel = TYPES.find(t => t.id === type);
  const r = prix > 0 ? compute({ type, prix, nbCed, nbTot }) : null;

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "'Georgia', 'Times New Roman', serif" }}>
      <div style={{ background: C.navy, padding: "28px 20px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.15em", textTransform: "uppercase", color: C.gold, marginBottom: 8 }}>Simulateur — biot-avocat.com</div>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700, color: "#fff", lineHeight: 1.3 }}>Droits d'enregistrement</h1>
        <h2 style={{ margin: "4px 0 0", fontSize: 16, fontWeight: 400, color: "rgba(255,255,255,0.7)" }}>Cession de droits sociaux</h2>
      </div>

      <div style={{ padding: "12px 20px", background: C.infoBg, borderBottom: `1px solid ${C.border}` }}>
        <p style={{ fontSize: 12, color: C.navyLight, lineHeight: 1.5 }}>Base légale : art. 726 CGI — Taux variable selon la forme juridique de la société.</p>
      </div>

      <div style={{ padding: "24px 20px" }}>
        <TypeSel selected={type} onSelect={setType} />
        <NumInput label="Prix de cession" value={prix} onChange={setPrix} hint="Montant total convenu entre les parties pour la cession des titres." />

        {type === "parts" && (
          <>
            <NumInput label="Nombre de parts cédées" value={nbCed} onChange={setNbCed} hint="Pour le calcul de l'abattement (art. 726 I-1° bis CGI)." />
            <NumInput label="Nombre total de parts de la société" value={nbTot} onChange={setNbTot} hint="Capital social divisé en parts sociales." />
            <div style={{ padding: "14px 16px", borderRadius: 10, background: C.infoBg, border: `1px solid ${C.border}`, marginBottom: 20 }}>
              <p style={{ fontSize: 12, color: C.navyLight, lineHeight: 1.6 }}>
                <strong>Formule de l'abattement :</strong><br />
                23 000 € × (nombre de parts cédées ÷ nombre total de parts)
                {nbCed > 0 && nbTot > 0 && (<><br />= 23 000 € × ({nbCed.toLocaleString("fr-FR")} ÷ {nbTot.toLocaleString("fr-FR")}) = {fmt(Math.round((23000 * nbCed) / nbTot))}</>)}
              </p>
            </div>
          </>
        )}
      </div>

      {r && (
        <div style={{ padding: "0 20px 32px" }}>
          <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.border}`, overflow: "hidden", boxShadow: "0 2px 12px rgba(27,42,74,0.06)" }}>
            <div style={{ padding: "20px 20px 16px", borderBottom: `1px solid ${C.border}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Droits d'enregistrement estimés</div>
              <div style={{ fontSize: 34, fontWeight: 700, color: C.navy }}>{fmt(r.droits)}</div>
              <div style={{ fontSize: 13, color: C.muted, marginTop: 6 }}>Taux effectif : {(r.eff * 100).toFixed(2).replace(".", ",")} % du prix de cession</div>
            </div>

            <div style={{ padding: "16px 20px", background: C.bg }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, marginBottom: 10, textTransform: "uppercase", letterSpacing: "0.08em" }}>Détail du calcul</div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 6 }}>
                <span style={{ color: C.muted }}>Prix de cession</span>
                <span style={{ fontWeight: 600 }}>{fmt(r.prix)}</span>
              </div>
              {r.hasAb && <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginBottom: 6 }}>
                <span style={{ color: C.muted }}>– Abattement parts sociales</span>
                <span style={{ fontWeight: 600, color: C.success }}>– {fmt(r.ab)}</span>
              </div>}
              <div style={{ borderTop: `1px solid ${C.border}`, marginTop: 8, paddingTop: 8, display: "flex", justifyContent: "space-between", fontSize: 14 }}>
                <span style={{ fontWeight: 700, color: C.navy }}>Base taxable</span>
                <span style={{ fontWeight: 700, color: C.navy }}>{fmt(r.base)}</span>
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 14, marginTop: 6 }}>
                <span style={{ color: C.muted }}>× Taux ({r.cfg.tauxLabel})</span>
                <span style={{ fontWeight: 700, color: sel.color, fontSize: 16 }}>{fmt(r.droits)}</span>
              </div>
            </div>

            {r.minApplied && <div style={{ padding: "12px 20px", background: C.warnBg, borderTop: `1px solid ${C.warnBorder}` }}>
              <p style={{ fontSize: 12, color: C.goldDark }}>⚠️ Minimum de perception de 25 € appliqué (art. 674 CGI).</p>
            </div>}

            <div style={{ padding: "16px 20px", borderTop: `1px solid ${C.border}` }}>
              {type === "actions" && <p style={{ fontSize: 12, color: C.muted, lineHeight: 1.6 }}><strong>Note :</strong> Le taux de 0,10 % s'applique aux cessions d'actions de SAS et SA (cotées ou non). Aucun plafonnement n'est applicable depuis 2012.</p>}
              {type === "parts" && <p style={{ fontSize: 12, color: C.muted, lineHeight: 1.6 }}><strong>Note :</strong> L'abattement s'applique aux cessions de parts de SARL, SNC et sociétés civiles (hors prépondérance immobilière). Il est proportionnel au nombre de parts cédées.</p>}
              {type === "immo" && <p style={{ fontSize: 12, color: C.muted, lineHeight: 1.6 }}><strong>Note :</strong> Le taux de 5 % s'applique à toute cession de participations dans une société dont l'actif est principalement constitué d'immeubles (art. 726 I-2° CGI). Aucun abattement n'est applicable.</p>}
            </div>
          </div>

          {/* Comparatif */}
          <div style={{ marginTop: 16, background: C.card, borderRadius: 14, border: `1px solid ${C.border}`, overflow: "hidden", boxShadow: "0 2px 12px rgba(27,42,74,0.06)" }}>
            <div style={{ padding: "14px 20px", borderBottom: `1px solid ${C.border}` }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em" }}>Comparatif — même prix de cession</div>
            </div>
            <div style={{ padding: "4px 20px 16px" }}>
              {TYPES.map(t => {
                let d;
                if (t.id === "parts" && nbCed > 0 && nbTot > 0) {
                  const a = Math.round((23000 * nbCed) / nbTot);
                  d = Math.max(0, prix - Math.min(a, prix)) * t.taux;
                } else { d = prix * t.taux; }
                if (prix > 0 && d < 25) d = 25;
                const act = t.id === type;
                return (
                  <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: `1px solid ${C.bg}` }}>
                    <div>
                      <span style={{ fontSize: 13, fontWeight: act ? 700 : 400, color: act ? t.color : C.text }}>{t.label}</span>
                      <span style={{ fontSize: 11, color: C.muted, marginLeft: 6 }}>({t.tauxLabel})</span>
                    </div>
                    <span style={{ fontSize: 14, fontWeight: 700, color: act ? t.color : C.muted }}>{fmt(d)}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div style={{ marginTop: 20, padding: 16, borderRadius: 10, background: C.warnBg, border: `1px solid ${C.warnBorder}` }}>
            <p style={{ fontSize: 12, color: C.goldDark, lineHeight: 1.6 }}>
              <strong>Avertissement :</strong> Cette simulation est fournie à titre indicatif et ne constitue pas un conseil juridique ou fiscal personnalisé. Les résultats ne prennent pas en compte les honoraires d'avocat, les frais de greffe et les frais de publicité légale notamment. Le montant réel peut varier en fonction de votre situation (clause de garantie de passif, prix de cession vs valeur vénale, etc.).
              <br /><br /><strong>Me Benoît BIOT</strong> — Avocat au Barreau de Montpellier
            </p>
          </div>

          <a href="https://cal.com/maitre-benoit-biot/appel-decouverte" target="_blank" rel="noopener noreferrer"
            style={{ display: "block", marginTop: 16, padding: 16, background: C.gold, color: "#fff", textAlign: "center", borderRadius: 12, fontSize: 15, fontWeight: 700, textDecoration: "none", letterSpacing: "0.02em", boxShadow: `0 4px 14px ${C.gold}44` }}>
            Prendre rendez-vous — Appel découverte gratuit
          </a>
        </div>
      )}

      {!r && (
        <div style={{ padding: "40px 20px", textAlign: "center" }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>⬆️</div>
          <p style={{ color: C.muted, fontSize: 14 }}>Sélectionnez un type de cession et saisissez le prix pour obtenir une estimation.</p>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
